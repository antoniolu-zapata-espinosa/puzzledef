<style>

* {

        radial-gradient(circle at 15% 85%, #bfe9ff 0 55px, transparent 56px),

    min-height: 100vh;
}

.contenedor {
    max-width: 1100px;
    margin: auto;

    background: rgba(255,255,255,0.94);

    padding: 25px;

h1 {
    text-align: center;

    margin-top: 0;
    margin-bottom: 25px;
}

.juego {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 25px;
}

.panel {
    background: #f8fbff;

    border-radius: 22px;

    padding: 15px;
}

.titulo {
    text-align: center;

    font-size: 20px;

    font-weight: bold;

    color: #555;

    margin-bottom: 12px;
}


/* =========================
   IMAGEN DE REFERENCIA
========================= */

#referencia {
    width: 100%;

    aspect-ratio: 1 / 1;

    border-radius: 15px;

    background-size: cover;

    background-position: center;

    box-shadow:
        0 3px 8px rgba(0,0,0,0.12);
}


/* =========================
   TABLERO
========================= */

#tablero {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 3px;

    background: white;

    padding: 5px;

    border-radius: 15px;

    aspect-ratio: 1 / 1;
}


/* =========================
   HUECOS
========================= */

.hueco {

    position: relative;

    min-width: 0;

    aspect-ratio: 1 / 1;

    background: #edf2f6;

    border:
        2px dashed
        #c7d0d8;

    border-radius: 6px;
}

.hueco.correcto {

    border:
        2px solid
        #8bcf82;

    background: #effbea;
}


/* =========================
   PIEZAS
========================= */

.pieza {

    position: absolute;

    left: 2px;
    top: 2px;

    width: calc(100% - 4px);
    height: calc(100% - 4px);

    border-radius: 5px;

    cursor: grab;

    background-repeat: no-repeat;

    box-shadow:
        0 2px 5px rgba(0,0,0,0.25);

    touch-action: none;

    user-select: none;

    transition:
        transform 0.12s,
        box-shadow 0.12s;

    z-index: 2;
}

.pieza:active {
    cursor: grabbing;
}

.pieza.arrastrando {

    transform:
        scale(1.08);

    box-shadow:
        0 8px 18px rgba(0,0,0,0.30);

    z-index: 1000;
}


/* =========================
   BOTONES
========================= */

.controles {

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 25px;
}

.control {

    border: none;

    padding:
        13px 22px;

    border-radius: 30px;

    background: #ffd0e4;

    color: #555;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 3px 6px rgba(0,0,0,0.12);
}

.control:hover {

    transform: scale(1.04);
}

#mensaje {

    text-align: center;

    font-size: 17px;

    font-weight: bold;

    color: #666;

    margin-top: 15px;

    min-height: 25px;
}


/* =========================
   MÓVIL / TABLET
========================= */

@media (max-width: 700px) {

    .juego {

        grid-template-columns: 1fr;

    }

    .contenedor {

        padding: 15px;

    }

    body {

        padding: 10px;

    }

}

</style>
